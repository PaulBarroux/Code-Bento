<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Container</title>
    <link rel="stylesheet" href="styles.css"> <!-- Linking the external CSS file -->
</head>
<body>

<div class="container">
  <div class="Header">
    <img src="images/image-1-31.png" alt="Titre" class="Titre">
    <img src="images/vector-32.svg" alt="Logo" class="Logo">
  </div>
   
  <div class="Image1-container">
    <img src="images/Image-Principale-1.png" alt="Image qui apparait en premier" class="Image1">
  </div>

  <div class="Info2">
    <p id="Text1">Carhartt, fondée en 1889, est une marque américaine emblématique connue pour ses vêtements robustes et durables, conçus à l’origine pour les ouvriers. Elle s’est imposée dans la mode streetwear avec sa ligne Carhartt WIP, mêlant style urbain et fonctionnalité.</span></p>
    <img src="images/frame-9-5.png" alt="Image qui est a cote du text" class="Image2">
  </div>
  
  <div class="barejaune"></div>
  
  <div class="Images2">
    <img src="images/pentoufle-7.png" alt="Titre" class="pentoufle">
    <img src="images/tire-bouchon-8.png" alt="Titre" class="tire">
    <img src="images/image-2-9.png" alt="Titre" class="valise">
  </div>

</div>
</body>
</html>
